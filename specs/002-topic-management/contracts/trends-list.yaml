openapi: "3.1.0"
info:
  title: IAPulse — Trends Listing API
  version: "1.0.0"

paths:
  /api/trends:
    get:
      summary: Lista tendências coletadas com filtros opcionais
      description: >
        Retorna tendências ordenadas por data de coleta (mais recente primeiro).
        Suporta filtro por tópico (múltiplos), fonte e período predefinido.
        Paginação offset-based obrigatória.
      parameters:
        - name: topic
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          style: form
          explode: true
          description: Slug(s) do tópico para filtrar. Múltiplos valores = OR.
          example: "infraestrutura"
        - name: source
          in: query
          required: false
          schema:
            type: string
          description: Nome exato da fonte
          example: "arXiv"
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [1d, 7d, 30d, 90d]
          description: Período de coleta relativo ao momento da requisição
          example: "7d"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Lista paginada de tendências
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendListResponse"
              example:
                data:
                  - id: "660d1a2b3c4e5f6a7b8c9d10"
                    title: "FlashAttention-3: Fast and Accurate Attention"
                    summary: "We present FlashAttention-3, achieving 1.5-2x speedup..."
                    url: "https://arxiv.org/abs/2407.08608"
                    source: "arXiv"
                    topicSlug: "infraestrutura"
                    topicColor: "blue"
                    collectedAt: "2026-03-25T07:00:00.000Z"
                    score:
                      total: 4.35
                      scoredBy: "manual"
                  - id: "660d1a2b3c4e5f6a7b8c9d11"
                    title: "EU AI Act enters into force"
                    summary: "The regulation lays down harmonised rules on artificial intelligence..."
                    url: "https://eur-lex.europa.eu/..."
                    source: "EUR-Lex AI Act"
                    topicSlug: "regulamentacao"
                    topicColor: "emerald"
                    collectedAt: "2026-03-25T07:00:00.000Z"
                    score: null
                pagination:
                  page: 1
                  limit: 20
                  total: 143
                  totalPages: 8
        "422":
          description: Parâmetros inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/trends/sources:
    get:
      summary: Lista as fontes distintas presentes no banco
      description: Retorna os nomes únicos de todas as fontes que possuem tendências coletadas. Usado para popular o filtro de fonte.
      responses:
        "200":
          description: Lista de nomes de fontes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: string
              example:
                data:
                  - "arXiv"
                  - "EUR-Lex AI Act"
                  - "HackerNews"
                  - "Hugging Face Blog"
                  - "NVIDIA Developer Blog"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  schemas:
    TrendScore:
      type: object
      required: [total, scoredBy]
      properties:
        total:
          type: number
          minimum: 1.0
          maximum: 5.0
          example: 4.35
        scoredBy:
          type: string
          enum: [manual, llm]

    TrendListItem:
      type: object
      required: [id, title, summary, url, source, topicSlug, topicColor, collectedAt]
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
        url:
          type: string
          format: uri
        source:
          type: string
        topicSlug:
          type: string
        topicColor:
          type: string
          enum: [blue, emerald, violet, amber, rose, cyan, orange, teal, pink, indigo]
        collectedAt:
          type: string
          format: date-time
        score:
          oneOf:
            - $ref: "#/components/schemas/TrendScore"
            - type: "null"
          description: null se a tendência ainda não foi avaliada

    Pagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    TrendListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TrendListItem"
        pagination:
          $ref: "#/components/schemas/Pagination"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

  responses:
    InternalError:
      description: Erro interno do servidor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
